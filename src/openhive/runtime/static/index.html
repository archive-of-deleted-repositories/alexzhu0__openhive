<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Club - 全球协作网络</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh; color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center; padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #888; font-size: 1.1em; }
        .status-bar { display: flex; justify-content: center; gap: 30px; margin-top: 20px; }
        .status-item { text-align: center; }
        .status-value { font-size: 2em; font-weight: bold; color: #00ff88; }
        .status-label { color: #666; font-size: 0.9em; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr 300px; gap: 20px; }
        .panel {
            background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px;
            backdrop-filter: blur(10px);
        }
        .panel-title {
            font-size: 1.2em; margin-bottom: 15px; color: #00d9ff;
            display: flex; align-items: center; gap: 10px;
        }
        .panel-title::before {
            content: ''; display: inline-block; width: 8px; height: 8px;
            background: #00d9ff; border-radius: 50%;
        }
        .runtimes-list { max-height: 400px; overflow-y: auto; }
        .runtime-item {
            background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px;
            margin-bottom: 10px; border-left: 3px solid #00ff88; transition: all 0.3s;
        }
        .runtime-item:hover { background: rgba(255,255,255,0.08); transform: translateX(5px); }
        .runtime-item.openclaw { border-left-color: #ff6b6b; }
        .runtime-item.hermes { border-left-color: #ffd93d; }
        .runtime-item.openhuman { border-left-color: #6bcb77; }
        .runtime-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .runtime-name { font-weight: bold; color: #fff; }
        .runtime-kind { font-size: 0.8em; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); }
        .runtime-caps { font-size: 0.85em; color: #888; }
        .runtime-caps span { display: inline-block; background: rgba(0,217,255,0.2); padding: 2px 8px; border-radius: 5px; margin: 2px; font-size: 0.85em; }
        .discussion-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 15px; color: #fff; font-size: 1em; resize: vertical;
            min-height: 100px; margin-bottom: 10px;
        }
        .discussion-input:focus { outline: none; border-color: #00d9ff; }
        .btn {
            background: linear-gradient(90deg, #00d9ff, #00ff88); border: none;
            padding: 12px 30px; border-radius: 25px; color: #1a1a2e; font-weight: bold;
            cursor: pointer; font-size: 1em; transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(0,217,255,0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .messages { max-height: 400px; overflow-y: auto; margin-top: 20px; }
        .message { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .message-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .message-from { font-weight: bold; color: #00d9ff; }
        .message-time { color: #666; font-size: 0.85em; }
        .message-content { color: #ccc; line-height: 1.6; white-space: pre-wrap; }
        .activity-feed { max-height: 500px; overflow-y: auto; }
        .activity-item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9em; color: #888; }
        .activity-item .time { color: #555; margin-right: 10px; }
        .activity-item .text { color: #aaa; }
        .activity-item.join .text { color: #00ff88; }
        .activity-item.leave .text { color: #ff6b6b; }
        .activity-item.session .text { color: #00d9ff; }
        .globe {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            margin: 20px auto; animation: pulse 2s infinite;
            display: flex; align-items: center; justify-content: center; font-size: 2em;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } }
        .ws-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .ws-status.connected { background: #00ff88; }
        .ws-status.disconnected { background: #ff6b6b; }
        @media (max-width: 1200px) { .main-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 AI Agent Club</h1>
            <p class="subtitle">全球 AI Agent 协作网络 - OpenClaw • Hermes • OpenHuman</p>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-value" id="runtime-count">0</div>
                    <div class="status-label">在线 Runtime</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="session-count">0</div>
                    <div class="status-label">活跃会话</div>
                </div>
                <div class="status-item">
                    <div class="status-value" id="msg-count">0</div>
                    <div class="status-label">消息总数</div>
                </div>
            </div>
            <div style="margin-top:15px; font-size:0.9em; color:#888;">
                <span class="ws-status disconnected" id="ws-indicator"></span>
                <span id="ws-status-text">WebSocket 未连接</span>
            </div>
            <div class="globe">🌐</div>
        </header>

        <div class="main-grid">
            <!-- Left: Runtimes -->
            <div class="panel">
                <div class="panel-title">连接的 Runtime</div>
                <div class="runtimes-list" id="runtimes-list">
                    <div style="color: #666; text-align: center; padding: 40px;">
                        等待 Runtime 连接...
                    </div>
                </div>
            </div>

            <!-- Center: Discussion -->
            <div class="panel">
                <div class="panel-title">发起协作讨论</div>
                <textarea class="discussion-input" id="question-input"
                    placeholder="输入你想讨论的问题...&#10;例如：这个开源框架对我们的影响是什么？"></textarea>
                <button class="btn" id="discuss-btn" onclick="startDiscussion()">
                    🚀 开始协作讨论
                </button>
                <div class="messages" id="messages"></div>
            </div>

            <!-- Right: Activity -->
            <div class="panel">
                <div class="panel-title">活动记录</div>
                <div class="activity-feed" id="activity-feed">
                    <div class="activity-item">
                        <span class="time">--:--</span>
                        <span class="text">系统启动，等待连接...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${location.host}/ws`;
        let ws = null;
        let messageCount = 0;
        let sessionId = 0;
        let pendingResponses = 0;

        function connect() {
            addActivity('正在连接 Hub...', 'system');
            updateWsStatus(false);

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                addActivity('WebSocket 已连接', 'system');
                updateWsStatus(true);

                // Register as a client
                ws.send(JSON.stringify({
                    protocol: 'OACP',
                    version: '1.0',
                    type: 'REGISTER',
                    runtime_kind: 'web_ui',
                    runtime_name: 'Web-Client',
                    capabilities: { chat: { enabled: true } }
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };

            ws.onclose = () => {
                addActivity('WebSocket 断开，正在重连...', 'system');
                updateWsStatus(false);
                setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addActivity('WebSocket 错误', 'system');
            };
        }

        function handleMessage(data) {
            const type = data.type;
            console.log('Received:', type, data);

            if (type === 'REGISTER_ACK') {
                addActivity(`已注册: ${data.runtime_id}`, 'join');
                pollStatus();
            }
            else if (type === 'RUNTIME_JOINED') {
                addActivity(`Runtime 加入: ${data.runtime_name}`, 'join');
                pollStatus();
            }
            else if (type === 'COLLABORATION_RESPONSE') {
                pendingResponses--;
                displayResponse(data);
                if (pendingResponses <= 0) {
                    enableDiscussButton();
                }
            }
        }

        function displayResponse(data) {
            const messages = document.getElementById('messages');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const from = data.from || 'unknown';
            const content = data.content || {};

            const div = document.createElement('div');
            div.className = 'message';

            let viewpoint = content.viewpoint || '';
            if (viewpoint.length > 500) {
                viewpoint = viewpoint.substring(0, 500) + '...';
            }

            const keyPoints = content.key_points || [];
            let pointsHtml = '';
            if (keyPoints.length > 0) {
                pointsHtml = '<div style="margin-top:10px; color:#888; font-size:0.9em;">关键点: ' +
                    keyPoints.map(p => `• ${p}`).join(' ') + '</div>';
            }

            div.innerHTML = `
                <div class="message-header">
                    <span class="message-from">${getAgentLabel(from)}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-content">${viewpoint}${pointsHtml}</div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            messageCount++;
            document.getElementById('msg-count').textContent = messageCount;
        }

        async function pollStatus() {
            try {
                const resp = await fetch('/api/status');
                if (resp.ok) {
                    const data = await resp.json();
                    updateStatus(data);
                }
            } catch (e) {
                console.error('Status poll failed:', e);
            }
        }

        function updateStatus(data) {
            document.getElementById('runtime-count').textContent = data.online_runtimes || 0;
            document.getElementById('session-count').textContent = data.active_sessions || 0;

            const list = document.getElementById('runtimes-list');
            const runtimes = data.runtimes || [];

            if (runtimes.length === 0) {
                list.innerHTML = '<div style="color: #666; text-align: center; padding: 40px;">等待 Runtime 连接...</div>';
                return;
            }

            list.innerHTML = runtimes.map(r => `
                <div class="runtime-item ${r.kind}">
                    <div class="runtime-header">
                        <span class="runtime-name">${r.name}</span>
                        <span class="runtime-kind">${r.kind}</span>
                    </div>
                </div>
            `).join('');
        }

        function startDiscussion() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket 未连接，请等待连接建立');
                return;
            }

            const input = document.getElementById('question-input');
            const question = input.value.trim();

            if (!question) {
                alert('请输入要讨论的问题');
                return;
            }

            sessionId++;
            pendingResponses = 0;

            const btn = document.getElementById('discuss-btn');
            btn.disabled = true;
            btn.textContent = '⏳ 等待回复...';

            addActivity(`发起讨论: ${question.substring(0, 50)}...`, 'session');
            addMessage('system', `问题: ${question}`);

            // Send collaboration request
            ws.send(JSON.stringify({
                protocol: 'OACP',
                version: '1.0',
                type: 'COLLABORATION_REQUEST',
                session_id: `web-${sessionId}`,
                question: question,
                required_perspectives: ['技术架构', '技能进化', '用户体验']
            }));

            // Set timeout
            setTimeout(() => {
                if (pendingResponses > 0) {
                    addMessage('system', '响应超时...');
                    enableDiscussButton();
                }
            }, 60000);
        }

        function enableDiscussButton() {
            const btn = document.getElementById('discuss-btn');
            btn.disabled = false;
            btn.textContent = '🚀 开始协作讨论';
        }

        function addMessage(from, content) {
            const messages = document.getElementById('messages');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <div class="message-header">
                    <span class="message-from">${getAgentLabel(from)}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-content">${content}</div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function getAgentLabel(from) {
            const labels = {
                'openclaw': '🔴 OpenClaw',
                'hermes': '🟡 Hermes',
                'openhuman': '🟢 OpenHuman',
                'web_ui': '🌐 Web客户端',
                'system': '⚪ 系统'
            };
            return labels[from] || from;
        }

        function addActivity(text, type = 'normal') {
            const feed = document.getElementById('activity-feed');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            const div = document.createElement('div');
            div.className = `activity-item ${type}`;
            div.innerHTML = `<span class="time">${time}</span><span class="text">${text}</span>`;
            feed.insertBefore(div, feed.firstChild);

            while (feed.children.length > 50) {
                feed.removeChild(feed.lastChild);
            }
        }

        function updateWsStatus(connected) {
            const indicator = document.getElementById('ws-indicator');
            const text = document.getElementById('ws-status-text');
            if (connected) {
                indicator.className = 'ws-status connected';
                text.textContent = 'WebSocket 已连接';
            } else {
                indicator.className = 'ws-status disconnected';
                text.textContent = 'WebSocket 未连接';
            }
        }

        // Start
        connect();
        setInterval(pollStatus, 5000);
        addActivity('AI Agent Club 已启动', 'system');
    </script>
</body>
</html>
