name: my-team
description: My first OpenHive team
agents:
- name: orchestrator
  role: orchestrator
  description: Task planner and coordinator
  max_iterations: 10
  timeout_seconds: 300
- name: research
  role: specialist
  description: Research specialist
  max_iterations: 10
  timeout_seconds: 300
- name: analysis
  role: specialist
  description: Analysis specialist
  max_iterations: 10
  timeout_seconds: 300
enterprise:
  policy:
    name: enterprise-default
    parallelism: 2
    redundancy: 1
    candidate_count: 2
    high_risk_threshold: high
    min_result_chars: 120
    audit_enabled: true
    scorer_length_weight: 0.55
    scorer_evidence_weight: 0.30
    scorer_structure_weight: 0.15
    scorer_length_target_factor: 2.0
    scorer_duplicate_similarity_threshold: 0.92
    winner_confidence_threshold: 0.75
    max_retry_rounds: 0
    retry_on_low_confidence: true
    scorer_evidence_fields:
      - content
      - findings
      - insights
      - analysis
      - evidence
      - sources
      - links
      - recommendations
      - conclusion
      - summary
  department_pricing: {}
  runtime_bridge:
    enabled: false
    hub_url: ws://localhost:9090/ws
    connect_timeout_seconds: 10
    request_timeout_seconds: 120
    runtimes:
      - openclaw
      - hermes
redis:
  host: localhost
  port: 6379
  db: 0
  password: null
database:
  host: localhost
  port: 5432
  database: openhive
  user: postgres
  password: ''
llm:
  provider: minimax
  api_key: ""
  base_url: https://api.minimaxi.com/anthropic/v1
  model: MiniMax-M2.7-highspeed
  max_tokens: 8192
  temperature: 0.7
